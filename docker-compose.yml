services:

  # BuildKit daemon — Railpack uses this to build images
  buildkit:
    image: moby/buildkit:latest
    privileged: true
    container_name: buildkit
    networks:
      - brimble_net
    restart: unless-stopped

  # Caddy — single point of ingress; routes added dynamically via admin API
  caddy:
    image: caddy:2-alpine
    networks:
      - brimble_net
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

  # TypeScript backend API + deployment pipeline
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - brimble_net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sqlite_data:/data/sqlite
      - workspaces:/volumes/workspaces
    environment:
      DATABASE_URL: /data/sqlite/db.sqlite
      BUILDKIT_HOST: docker-container://buildkit
      CADDY_ADMIN_URL: http://caddy:2019
      DOCKER_NETWORK: brimble_net
      WORKSPACES_DIR: /volumes/workspaces
      PORT: "3001"
    depends_on:
      - buildkit
      - caddy
    restart: unless-stopped

  # Vite + React frontend (built as static files, served by nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    networks:
      - brimble_net
    restart: unless-stopped

networks:
  brimble_net:
    driver: bridge
    name: brimble_net

volumes:
  sqlite_data:
  caddy_data:
  workspaces:
